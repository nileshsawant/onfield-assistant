# ofa site configuration — template.
#
# Copy this file to $OFA_ROOT/site.toml and edit the values for your HPC
# system. site.toml itself is in .gitignore so per-site overrides never
# collide with `git pull` upstream.
#
# When a value is not set here, ofa falls back to the Kestrel defaults
# baked into `src/ofa_site.py`. That means:
#
#   * A stock checkout on Kestrel with NO site.toml keeps running exactly
#     as before this refactor (banner text, scheduler flags, protected
#     paths, everything).
#   * A stock checkout on any other site with NO site.toml will still
#     start, but the interactive banner will call itself "Kestrel", the
#     BYOK ssh -L hint will mention kestrel.hpc.nlr.gov, and the SLURM
#     resource request will use Kestrel's shape. Write a real site.toml
#     to fix that.
#
# ALSO REVIEW when porting to a new HPC (site.toml is NOT enough on its own):
#   * prompts/*.txt — identity strings ("running natively on the <site>")
#     are templated via {SITE_NAME} / {SITE_LONG_NAME} / {SITE_ORG} /
#     {SITE_DESCRIPTION} placeholders and filled from this file
#     automatically. But each prompt also contains LITERAL Kestrel
#     TECHNICAL content that is deliberately NOT templated — templating it
#     would make the model lie confidently about your cluster. Only the
#     prompts for the MODES YOU ENABLE need fixing. Per-file checklist
#     (rewrite for your site, or delete the offending lines):
#       - openfoam.txt: rule 14 (nProcs "36/72/144" core counts) and the
#         whole "KESTREL HPC SPECIFICS" block at the end — module names,
#         `standard (104 cores)/hbw/debug` partitions, srun launcher, the
#         GILA-cluster mpirun-not-srun rule, and the /nopt/nrel OpenFOAM
#         bashrc path. Replace with your modules/partitions/launcher.
#       - reframe.txt: ENTIRE body is a Kestrel RHEL8->RHEL9 migration
#         narrative (kl3/kl5, gpu-h100 + --reservation=rh9, PrgEnv-cray,
#         settings-kestrel-rh9.py, clean-slate, /nopt/nrel -> /nopt/nlr).
#         Only meaningful if you run a ReFrame RHEL-migration; otherwise
#         disable the mode. Rewrite wholesale if you keep it.
#       - amrex.txt / marbles.txt / quantum-computing.txt: the
#         `module load cray-mpich cuda/12.4 cmake` example on line 4.
#         Swap for your GPU/MPI/toolchain module names.
#       - cpp.txt / common.txt: `srun --overlap` guidance (Cray/Slurm
#         step-deadlock workaround). Harmless on plain Slurm; remove if
#         your scheduler isn't Slurm.
#       - common.txt: the cd-guard path list includes /nopt/nrel,
#         /nopt/nlr, /nopt/slurm — these are ALSO covered by
#         [site].protected_roots below; keep them consistent.
#       - prompts/skills/kestrel-debug-jobs.md: entirely Kestrel (debug
#         partition 1-hr cap, --gres=gpu:h100:1, shared nodes). Rewrite
#         or delete for your site's debug-queue rules.
#     NOTE: the `srun --overlap` auto-injection also exists in code
#     (src/ofa_main.py) and applies on Slurm generally — harmless off-Cray.
#   * collections.toml — declares the RAG source dirs. Replace the
#     Kestrel-specific corpora (HPC docs, amrex/marbles/etc. clones)
#     with sources that make sense for your users.

[site]
# Short site name printed in the interactive banner and inside the LLM
# system prompts wherever the {SITE_NAME} placeholder appears.
name = "MySiteHPC"

# Sponsoring organization / lab. Consumed by the {SITE_ORG} placeholder,
# most notably in hpc.txt ("an {SITE_ORG} HPC Support Assistant …").
org = "MyLab"

# Full noun phrase used by the {SITE_LONG_NAME} placeholder in prompts.
# Written out longhand so porters can tune the grammar — some sites are
# called "clusters", others "supercomputers", others just their name.
# Example: "MyLab's MySiteHPC cluster" or "the MySiteHPC supercomputer".
long_name = "the MySiteHPC supercomputer"

# Trailing GPU descriptor in the banner. Rendered as:
#   "locally hosted on <name> · <description>"
# Also flows into common.txt's identity line via {SITE_DESCRIPTION}.
# Keep it short — e.g. "single A100", "quarter GPU node", "4x H100".
description = "single A100"

# Host users ssh from their laptop to reach this cluster's login node.
# Printed in the `ssh -L …` suggestion emitted by `ofa --serve` when a
# client wants to reach the compute-node BYOK endpoint from off-cluster.
login_host = "mysite.example.edu"

# Absolute path prefixes ofa's safety layer refuses to touch via
# rm/chmod/chown-style mass operations, even after explicit user
# approval. Merged additively with the universal system paths
# ("/bin", "/etc", "/usr", …) already hard-coded in ofa_main.py.
#
# Include any site-managed software or scratch roots that a stray LLM
# suggestion must not wipe. The stream-kill regex is regenerated from
# this list at import time, so an entry here also protects against
# `rm -rf` verbose output already appearing on stdout.
protected_roots = [
    "/opt/mysite",
    "/global/common",
]

[scheduler]
# One of: "slurm" | "none"  (default when unset: "slurm").
#   slurm -> ofa auto-allocates a GPU node via salloc/srun.
#   none  -> no batch scheduler; ofa runs in place on the current host
#            (single-GPU box, or you already `salloc`ed yourself). It still
#            loads the [modules] below and starts Ollama locally.
# "pbs" / "lsf" are NOT implemented — bin/ofa will refuse to start with a
# clear error rather than emit an incorrect salloc. Use "none" and wrap
# ofa in your own scheduler submission if you're on PBS/LSF.
kind = "slurm"

# Default partition / queue name used when the user does not set
# $OFA_PARTITION. Match your site's naming.
partition = "gpu"

# Slurm GRES string for one GPU. Match your site's naming, e.g.
# "gpu:a100:1", "gpu:h100:1", or just "gpu:1" if your cluster only
# has one GPU model.
gres = "gpu:1"

# Memory allocation per job.
mem = "80G"

# CPU tasks per node. ofa's model server itself is single-process, but
# tools it spawns inside the allocation (compilers, mpirun, srun steps)
# may need the full CPU shape.
ntasks_per_node = 32

# Default wall time when the user does not set $OFA_WALLTIME.
walltime = "00:30:00"

# Bash command that must print the user's default account on stdout as
# a single line. Executed via `bash -c` from `bin/ofa` when
# $OFA_ACCOUNT is not already set. Leave as an empty string to require
# users to always set $OFA_ACCOUNT explicitly.
#
# Security note: this string is executed by the launching user's shell
# in the launching user's environment. It is not a privilege boundary.
account_discovery = 'sacctmgr show user "$USER" format=defaultaccount -nP 2>/dev/null | head -1'

[modules]
# Module names loaded on the compute node before ofa starts. `bin/ofa`
# picks cuda_rhel9 on hosts whose /etc/redhat-release contains
# "release 9", cuda_rhel8 otherwise. Set to an empty string to skip
# the module load entirely (e.g. sites without Lmod, or sites where
# CUDA is already on PATH via /etc/profile.d).
cuda_rhel8 = "cuda/12.4"
cuda_rhel9 = "cuda"

# Extra modules loaded on EVERY compute node regardless of OS, after the
# cuda_rhel* selection above. This is the portability escape hatch for
# sites that are NOT RHEL, or use ROCm / a different CUDA layout, or need
# a whole GPU-stack module list. Accepts a space-separated string or a
# TOML list; each entry is `module load`-ed (failures ignored). Empty by
# default so Kestrel is unaffected.
#   extra = "rocm/6.0"
#   extra = ["gcc/12", "openmpi/5", "cuda/12.6"]
extra = ""

# ---------------------------------------------------------------------------
# Environment-variable-only overrides (NOT in site.toml)
# ---------------------------------------------------------------------------
# A few paths are configured via environment variables rather than this
# file (set them in your Lmod modulefile or env.sh). They only matter if
# you use the affected feature:
#
#   OFA_PINNED_DOCS_ROOT   Base dir for the per-mode "pinned" docs read
#                          straight from disk (marbles/quantum/vasp modes).
#                          Default: $OFA_ROOT/repos/HPC/docs/Documentation
#                          Missing files degrade silently to no pin.
#   OFA_OPENFOAM13_ROOT    OpenFOAM-13 tree for the OpenFOAM RAG indexers.
#   OFA_OPENFOAM_V2512_ROOT  OpenFOAM v2512 tree (legacy build_index.py).
#   OFA_KESTREL_DOCS_ROOT  HPC docs tree for build_index_v2.py.
#   OFA_LITELLM_BASE_URL   Frontier-model gateway (see docs); e.g.
#                          https://your-litellm-host/v1
#   OFA_MODEL / OFA_MODELS_JSON  Override the default LLM / model registry.
